<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#257de0"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f47230"/>
    </marker>
  </defs>

  <!-- white background so it reads well in dark-mode notebooks too -->
  <rect width="760" height="580" fill="#ffffff"/>

  <!-- column headers -->
  <text x="205" y="32" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b5fae" letter-spacing="1">STIMULI → LM</text>
  <text x="565" y="32" text-anchor="middle" font-size="14" font-weight="bold" fill="#b9501c" letter-spacing="1">BEHAVIORAL DATA</text>

  <!-- 1. Understand data structure -->
  <rect x="40" y="48" width="330" height="104" rx="10" fill="#eaf2fd" stroke="#257de0" stroke-width="1.5"/>
  <circle cx="64" cy="73" r="12" fill="#257de0"/>
  <text x="64" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">1</text>
  <text x="84" y="78" font-size="15" font-weight="bold" fill="#1a1a1a">Understand data structure</text>
  <text x="56" y="104" font-size="13" fill="#333">• Which columns identify each unique</text>
  <text x="68" y="121" font-size="13" fill="#333">sentence/paragraph?</text>
  <text x="56" y="141" font-size="13" fill="#333">• How long is each sentence/paragraph?</text>

  <!-- 2. Text units in behavioral data -->
  <rect x="390" y="48" width="330" height="104" rx="10" fill="#fef0e7" stroke="#f47230" stroke-width="1.5"/>
  <circle cx="414" cy="73" r="12" fill="#f47230"/>
  <text x="414" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">2</text>
  <text x="434" y="78" font-size="15" font-weight="bold" fill="#1a1a1a">Text units in behavioral data</text>
  <text x="406" y="104" font-size="13" fill="#333">• What text units (words, regions, etc.)</text>
  <text x="418" y="121" font-size="13" fill="#333">are the behavioral measures</text>
  <text x="418" y="138" font-size="13" fill="#333">recorded on?</text>

  <!-- 3. Tokenize -->
  <rect x="40" y="190" width="330" height="70" rx="10" fill="#eaf2fd" stroke="#257de0" stroke-width="1.5"/>
  <circle cx="64" cy="215" r="12" fill="#257de0"/>
  <text x="64" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">3</text>
  <text x="84" y="220" font-size="15" font-weight="bold" fill="#1a1a1a">Tokenize stimuli for the LM</text>
  <text x="56" y="246" font-size="13" fill="#333">• Convert stimuli text into LM tokens</text>

  <!-- 4. Run LM -->
  <rect x="40" y="298" width="330" height="50" rx="10" fill="#eaf2fd" stroke="#257de0" stroke-width="1.5"/>
  <circle cx="64" cy="323" r="12" fill="#257de0"/>
  <text x="64" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">4</text>
  <text x="84" y="328" font-size="15" font-weight="bold" fill="#1a1a1a">Run the LM on the tokenized stimuli</text>

  <!-- 5. Extract features -->
  <rect x="40" y="386" width="330" height="70" rx="10" fill="#eaf2fd" stroke="#257de0" stroke-width="1.5"/>
  <circle cx="64" cy="411" r="12" fill="#257de0"/>
  <text x="64" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">5</text>
  <text x="84" y="416" font-size="15" font-weight="bold" fill="#1a1a1a">Extract token-level LM features</text>
  <text x="56" y="442" font-size="13" fill="#333">• e.g., surprisal, entropy</text>

  <!-- 6. Align -->
  <rect x="40" y="494" width="680" height="66" rx="10" fill="#f2f0fa" stroke="#5b4bb7" stroke-width="1.5"/>
  <circle cx="64" cy="519" r="12" fill="#5b4bb7"/>
  <text x="64" y="524" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">6</text>
  <text x="84" y="524" font-size="15" font-weight="bold" fill="#1a1a1a">Align with behavioral units</text>
  <text x="56" y="547" font-size="13" fill="#333">• Map token-level LM features back to the text units in the behavioral data</text>

  <!-- arrows on the LM side -->
  <line x1="205" y1="152" x2="205" y2="188" stroke="#257de0" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="205" y1="260" x2="205" y2="296" stroke="#257de0" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="205" y1="348" x2="205" y2="384" stroke="#257de0" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="205" y1="456" x2="205" y2="492" stroke="#257de0" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- arrow from behavioral units to alignment -->
  <line x1="555" y1="152" x2="555" y2="492" stroke="#f47230" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr-orange)"/>
  <text x="567" y="318" font-size="13" font-style="italic" fill="#b9501c">target text units</text>
  <text x="567" y="335" font-size="13" font-style="italic" fill="#b9501c">for alignment</text>
</svg>
