<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif">
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#257de0"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f47230"/></marker>
<marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b4bb7"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#d0d0d0" stroke-width="2"/></pattern>
</defs>
<rect width="900" height="470" fill="#ffffff"/>
<text x="450.0" y="30" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">gather(): pick out the log probability of the actual next token</text>
<text x="450.0" y="52" font-size="12.5" fill="#555555" text-anchor="middle" font-weight="normal" font-style="normal">Sentence 2, position 1 (input token ĠThe)</text>
<text x="205.0" y="88" font-size="14" fill="#1b5fae" text-anchor="middle" font-weight="bold" font-style="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">log_probs[1, 0, :]</text>
<text x="205.0" y="106" font-size="11.5" fill="#555555" text-anchor="middle" font-weight="normal" font-style="normal">one log probability per vocabulary entry (50,257)</text>
<rect x="80" y="120" width="250" height="30" rx="4" fill="#ffffff" stroke="#b9cff0" stroke-width="1.2"/>
<text x="92" y="140" font-size="12.5" fill="#555555" text-anchor="start" font-weight="normal" font-style="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">0</text>
<text x="152" y="140" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">!</text>
<text x="318" y="140" font-size="12.5" fill="#aaa" text-anchor="end" font-weight="normal" font-style="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">…</text>
<rect x="80" y="154" width="250" height="30" rx="4" fill="#ffffff" stroke="#b9cff0" stroke-width="1.2"/>
<text x="92" y="174" font-size="12.5" fill="#555555" text-anchor="start" font-weight="normal" font-style="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">1</text>
<text x="152" y="174" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">&quot;</text>
<text x="318" y="174" font-size="12.5" fill="#aaa" text-anchor="end" font-weight="normal" font-style="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">…</text>
<rect x="80" y="188" width="250" height="30" rx="4" fill="#ffffff" stroke="#b9cff0" stroke-width="1.2"/>
<text x="92" y="208" font-size="12.5" fill="#555555" text-anchor="start" font-weight="normal" font-style="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">2</text>
<text x="152" y="208" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">#</text>
<text x="318" y="208" font-size="12.5" fill="#aaa" text-anchor="end" font-weight="normal" font-style="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">…</text>
<text x="205.0" y="244" font-size="18" fill="#555555" text-anchor="middle" font-weight="normal" font-style="normal">⋮</text>
<rect x="80" y="256" width="250" height="30" rx="4" fill="#fef0e7" stroke="#f47230" stroke-width="2"/>
<text x="92" y="276" font-size="12.5" fill="#b9501c" text-anchor="start" font-weight="bold" font-style="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">7331</text>
<text x="152" y="276" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">Ġtall</text>
<text x="318" y="276" font-size="12.5" fill="#1a1a1a" text-anchor="end" font-weight="bold" font-style="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">−10.18</text>
<text x="205.0" y="312" font-size="18" fill="#555555" text-anchor="middle" font-weight="normal" font-style="normal">⋮</text>
<rect x="80" y="324" width="250" height="30" rx="4" fill="#ffffff" stroke="#b9cff0" stroke-width="1.2"/>
<text x="92" y="344" font-size="12.5" fill="#555555" text-anchor="start" font-weight="normal" font-style="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">50256</text>
<text x="152" y="344" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">&lt;|endoftext|&gt;</text>
<text x="318" y="344" font-size="12.5" fill="#aaa" text-anchor="end" font-weight="normal" font-style="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">…</text>
<text x="92" y="372" font-size="11" fill="#555555" text-anchor="start" font-weight="normal" font-style="normal">id</text>
<text x="152" y="372" font-size="11" fill="#555555" text-anchor="start" font-weight="normal" font-style="normal">token</text>
<text x="318" y="372" font-size="11" fill="#555555" text-anchor="end" font-weight="normal" font-style="normal">log prob (nats)</text>
<rect x="430" y="150" width="190" height="70" rx="8" fill="#fef0e7" stroke="#f47230" stroke-width="1.5"/>
<text x="525" y="178" font-size="13.5" fill="#b9501c" text-anchor="middle" font-weight="bold" font-style="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">target_ids[1, 0]</text>
<text x="525" y="202" font-size="13.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">= 7331  (Ġtall)</text>
<text x="525" y="138" font-size="12" fill="#555555" text-anchor="middle" font-weight="normal" font-style="normal">the actual next token</text>
<path d="M 430 185 C 380 185, 390 271.0, 336 271.0" fill="none" stroke="#f47230" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a-orange)"/>
<text x="404" y="248" font-size="12" fill="#b9501c" text-anchor="start" font-weight="normal" font-style="italic">use as index</text>
<line x1="336" y1="279.0" x2="426" y2="330" stroke="#5b4bb7" stroke-width="2" marker-end="url(#a-purple)"/>
<rect x="430" y="300" width="190" height="60" rx="8" fill="#f2f0fa" stroke="#5b4bb7" stroke-width="1.5"/>
<text x="525" y="325" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">−10.18 nats</text>
<text x="525" y="345" font-size="12" fill="#555555" text-anchor="middle" font-weight="normal" font-style="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">log P(Ġtall | ĠThe)</text>
<line x1="622" y1="330" x2="680" y2="330" stroke="#5b4bb7" stroke-width="2" marker-end="url(#a-purple)"/>
<text x="651" y="320" font-size="12" fill="#5b4bb7" text-anchor="middle" font-weight="normal" font-style="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">÷ ln 2</text>
<rect x="684" y="300" width="190" height="60" rx="8" fill="#f2f0fa" stroke="#5b4bb7" stroke-width="1.5"/>
<text x="779" y="325" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">−14.69 bits</text>
<text x="779" y="345" font-size="12" fill="#555555" text-anchor="middle" font-weight="normal" font-style="normal" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">token_logps[1, 0]</text>
<text x="450.0" y="430" font-size="12.5" fill="#555555" text-anchor="middle" font-weight="normal" font-style="normal">The same lookup happens at every position of every sentence, all at once.</text>
</svg>
